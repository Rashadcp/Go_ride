name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-ride-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            cd "${{ secrets.EC2_APP_DIR }}"
            export DOCKERHUB_USERNAME="${{ secrets.DOCKER_USERNAME }}"

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
              COMPOSE_IS_LEGACY="false"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
              COMPOSE_IS_LEGACY="true"
            else
              echo "Docker Compose is not installed. Install docker-compose-plugin or docker-compose on the EC2 instance."
              exit 1
            fi

            $COMPOSE -f docker-compose.prod.yml pull
            if [ "$COMPOSE_IS_LEGACY" = "true" ]; then
              echo "Legacy docker-compose detected; removing old containers before recreate to avoid ContainerConfig errors."
              $COMPOSE -f docker-compose.prod.yml down --remove-orphans || true
            fi
            $COMPOSE -f docker-compose.prod.yml up -d
            $COMPOSE -f docker-compose.prod.yml ps

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 http://localhost:5001/health; then
                echo "Backend health check passed."
                exit 0
              fi

              echo "Backend health check failed, retrying ($attempt/30)..."
              sleep 2
            done

            echo "Backend did not become healthy. Container status:"
            $COMPOSE -f docker-compose.prod.yml ps || true
            echo "Backend logs:"
            $COMPOSE -f docker-compose.prod.yml logs --tail=200 backend || true
            exit 1
